name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-schedule-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Read app version
        id: ver
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build-${{ github.run_number }}
          name: 知酷课程表 v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            ### 知酷课程表 v${{ steps.ver.outputs.version }}（build ${{ github.run_number }}）
            - 自动构建的 Android 安装包（预览签名，可直接安装测试）
            - 安装前请允许「未知来源」
            - 应用内「我的 → 检查更新」会读取 Releases 最新版本
          files: android/app/build/outputs/apk/release/app-release.apk